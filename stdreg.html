<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .registration-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }

    .registration-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555555;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.2s ease-in-out;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #4a90e2;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    .submit-btn:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>

  <div class="registration-card">
    <h2>Student Registration</h2>
    <form action="#" method="POST">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required>
      </div>

      <!-- Phone Field -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. +1 234 567 8900" required>
      </div>

      <!-- Date of Birth Field -->
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <!-- Course Selection -->
      <div class="form-group">
        <label for="course">Course / Program</label>
        <select id="course" name="course" required>
          <option value="" disabled selected>Select a course</option>
          <option value="cs">Computer Science</option>
          <option value="ba">Business Administration</option>
          <option value="ee">Electrical Engineering</option>
          <option value="art">Arts & Humanities</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Register</button>

    </form>
  </div>

</body>
</html>
